<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TermoAtiva — Painel de Calor</title>
<link rel="stylesheet" href="painel.css">
</head>
<body>
<header>
  <h1>TermoAtiva</h1>
  <p>Monitoramento térmico e apoio urbano — São Paulo (Sé / Brás)</p>
</header>
<main>
  <section id="alerta" class="card">
    <h2>Alerta de calor agora</h2>
    <label>Bairro
      <select id="bairro"><option>Sé</option><option>Brás</option></select>
    </label>
    <div id="alerta-conteudo">Carregando…</div>
  </section>
  <section class="card">
    <h2>Onde beber água / descansar</h2>
    <ul id="pontos"><li>Carregando…</li></ul>
  </section>
  <section class="card">
    <h2>Status do servidor</h2>
    <div id="health">Verificando…</div>
  </section>
</main>
<footer>FIAP · Global Solution 2026.2 · CitizenTech</footer>
<script src="painel.js"></script>
</body>
</html>
